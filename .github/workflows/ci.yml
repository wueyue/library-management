name: Java and PostgreSQL checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/library_test
      TEST_DB_USER: library
      TEST_DB_PASSWORD: library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format checks
        run: python3 tools/check_format.py
      - name: Build and run all tests against PostgreSQL
        run: mvn -B verify
      - name: Reject skipped tests
        run: python3 tools/check_ci_tests.py
